# Spiral Collection site — static export. Base directory: collection/
[build]
  command = "pnpm build"
  publish = "out"

# Hashed build assets never change — cache forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand assets (mark, tokens, future demo media) — one day
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Brand fonts are stable subsets — cache forever.
# Must come AFTER /brand/* — Netlify lets later matching rules win.
[[headers]]
  for = "/brand/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
