[package]
name = "spiral-clean"
version = "0.1.0"
description = "Spiral Clean"
authors = ["Cohen Coolidge"]
edition = "2021"

[lib]
name = "spiral_clean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
dirs = "6"
walkdir = "2"
trash = "5"
libc = "0.2"
spiral-license = { path = "../../../crates/spiral-license" }

[dev-dependencies]
tempfile = "3"
