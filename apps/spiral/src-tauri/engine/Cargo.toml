[package]
name = "spiral-resume-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Resume helper process"

[[bin]]
name = "spiral-resume-engine"
path = "src/main.rs"

[dependencies]
resume-proto = { path = "../crates/resume-proto" }
resume-core = { path = "../crates/resume-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[dev-dependencies]
resume-core = { path = "../crates/resume-core" }
resume-proto = { path = "../crates/resume-proto" }
serde_json = "1"
tempfile = "3"
