[package]
name = "resume-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Resume documents, Typst, and the model host"

[dependencies]
resume-proto = { path = "../resume-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
docx-rs = { version = "0.4", default-features = false }
zip = "8"
pdf-extract = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.11.0"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
