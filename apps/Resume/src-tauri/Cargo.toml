[package]
name = "spiral-resume"
version = "0.1.0"
description = "Spiral Resume"
authors = ["Cohen Coolidge"]
edition = "2021"

[lib]
name = "spiral_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
docx-rs = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
zip = "8.6.0"
