[package]
name = "spiral-slim"
version = "1.0.0"
description = "A local wizard for configuring Brave through SlimBrave Neo"
authors = ["Spiral"]
edition = "2021"

[lib]
name = "spiral_slim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately no HTTP client and no async runtime beyond Tauri's own:
# Spiral Slim never makes a network call.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Private 0700 directory for the plan file handed to the privileged script,
# rather than a hand-rolled /tmp path that another user could pre-create.
tempfile = "3"
icns = "0.4"
base64 = "0.23"
