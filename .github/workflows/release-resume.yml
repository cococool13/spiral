name: release-resume

# Spiral Resume releases on a `resume-v*` tag, independent of Wallpaper's bare
# `v*`, Slim's `slim-v*` and Clean's `clean-v*`.
#
#   node scripts/version.mjs check resume    # all four version files agree
#   git tag resume-v0.1.0 && git push origin resume-v0.1.0
#
# macOS and Windows, both in v1 — decision 16 of apps/Resume/docs/design-spec.md.
# macOS is signed with the same Developer ID as every other Spiral app and
# notarised; Windows is built unsigned, the same accepted gap the README
# documents for Wallpaper.
#
# Updater is off: this app ships no updater plugin, and the shared workflow's
# own comment warns that requiring a signed updater bundle from an app that
# never produced one fails the release for no reason.
#
# ALL THREE ENGINE TIERS ARE IN THIS RELEASE
#
# `sidecar: true` builds `llama-server` on each runner before Tauri packages
# the app — a native compile, not a cross-compile, which is why it happens on
# both runners rather than once. `bundle-config` then merges
# `src-tauri/tauri.bundle.conf.json`, the file that declares the sidecar as an
# `externalBin`; it is kept separate so that a machine without the binary can
# still compile and test the app with the plain config.
#
# The model itself is not in the release. It is a 2.7 GB download the user
# chooses in Settings, verified against the sha256 pinned in
# `apps/Resume/assets/model-catalogue.json` before it is installed.
#
# The cost is build time: llama.cpp is compiled twice on macOS (arm64 and
# x86_64, for the universal bundle) and once on Windows. If a release ever
# needs to skip it, drop `sidecar` and `bundle-config` — the app then reports
# the offline tier as unavailable on screen, which is a supported state and
# not a failure.
#
# apps/Resume/docs/offline-model.md is the record of what had to be true first.

on:
  push:
    tags: ["resume-v*"]
  workflow_dispatch:

jobs:
  release:
    # Without this the workflow does not merely fail — it never starts. A
    # called workflow cannot hold more than its caller was granted, this
    # repository defaults the token to read, and the shared workflow's publish
    # job needs `contents: write` to create the release. See release-clean.yml
    # for the same note.
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    secrets: inherit
    with:
      app-dir: apps/Resume
      artifact-prefix: resume
      macos: true
      windows: true
      updater: false
      sidecar: true
      bundle-config: src-tauri/tauri.bundle.conf.json
