name: license

# The licensing server is the shared Worker in Cohen's `licensing` repo; nothing here deploys.
on:
  push:
    branches: [main]
    paths:
      - "crates/spiral-license/**"
      - "scripts/check-checkout.mjs"
      - "scripts/sync-checkout.mjs"
      - "collection/lib/checkout.ts"
  pull_request:
    paths:
      - "crates/spiral-license/**"
      - "scripts/check-checkout.mjs"
      - "scripts/sync-checkout.mjs"
      - "collection/lib/checkout.ts"
  workflow_dispatch:

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - run: node scripts/check-checkout.mjs

  crate:
    # macOS and Windows run the guard that keyring uses the OS store, not its in-memory mock
    # (keys vanished on quit before the 2026-10-22 fix). App jobs do not run this crate's tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      # The crate belongs to the app workspace, so the lockfile and target
      # directory live there. Keyed on Cargo.lock. Saved only on main; the
      # three OS jobs restore that cache on pull requests.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/spiral/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test spiral-license crate
        working-directory: crates/spiral-license
        run: cargo test
