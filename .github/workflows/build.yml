name: build

on:
  push:
    branches: [main]
    # A v* tag cuts a release: the macos job builds signed and notarized, and
    # the release job publishes both platforms together.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# No workflow-level `defaults`. A job that calls a reusable workflow accepts
# only a fixed set of keys — name, needs, if, permissions, uses, with, secrets,
# strategy, concurrency — and a workflow-wide default tries to apply `defaults`
# to it, which GitHub rejects before the run starts. The one job that wants a
# different directory now says so itself, which is also plainer to read.
# One run per ref. Without this, two runs can exist for the same tag and both
# reach `publish`, racing to create the same GitHub Release — which is exactly
# what happened to v1.0.3 on 2026-08-06, when a dispatched run and a
# late-firing push run appeared 21 seconds apart.
#
# `cancel-in-progress` is true for branches and pull requests, where a newer
# push makes an older run pointless, and **false for tags**: cancelling a
# release part-way through publishing is a worse outcome than the duplicate.
# A second tag run instead queues behind the first and then fails loudly at
# `publish` because the release already exists, which is a clear answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Builds the website on every push and pull request, and deploys it when the
  # push is to main. It used to only build: deploying was `netlify deploy` run
  # by hand, which meant main could be green and correct for days while the
  # live site served something older, with nothing anywhere saying so.
  #
  # The deploy reuses this job's own `out/` rather than living in a job of its
  # own, so what ships is byte-for-byte what lint, typecheck, and build just
  # passed on — not a second build of the same commit.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection
    # Job level so the deploy step can branch on whether the token exists: the
    # `secrets` context is not usable in a step `if:`, but `env` is. Same
    # reason the Windows job lifts TAURI_KEY.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: collection/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collection/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # brand-tokens.json and public/brand are gitignored sync outputs; typecheck
      # imports the JSON and CSS imports the tokens file.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Lint + format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `prebuild` runs sync-brand again; a missing /brand asset fails here
      # rather than silently shipping a 404 to production.
      - name: Build static export
        run: pnpm build

      # Only a push to main, never a pull request: a PR deploying to production
      # would put unreviewed work on the live site, and PR builds already prove
      # the thing compiles. Forks and Dependabot get no token at all, so this
      # cannot fire from them even if the ref check were wrong.
      #
      # `out/` is the export this job already linted, typechecked and built —
      # wrangler uploads a directory and never builds, so what ships is
      # byte-for-byte what passed rather than a second build of the same commit.
      #
      # `--branch=main` is what marks the deployment as production. Without it
      # Pages treats every upload as a preview, and the site would go on
      # building green while the live URL never moved.
      #
      # Both secrets, not just the token. Wrangler reads the account id from the
      # environment to know whose account to talk to, so a token without one
      # gets past a token-only check and then fails mid-deploy — a red build on
      # main for a configuration mistake the skip path below exists to handle
      # quietly.
      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --package=wrangler@4 dlx wrangler pages deploy out --project-name=spiral-collection --branch=main

      # A push to main that cannot deploy should say so rather than report a
      # green build that shipped nothing. Not a failure: the build itself was
      # fine, and failing here would make the repo unusable for anyone who
      # forks it without the secrets.
      # Names the one that is missing rather than both. "Add these two secrets"
      # when one is already set sends someone to check a value that is fine.
      - name: Say so when the deploy was skipped
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          echo "::warning::Built but not published — missing repository secret(s):$missing"
          echo "Add them under Settings -> Secrets and variables -> Actions."
          exit 0

  # Spiral Slim — Python collection tests + desktop typecheck/vitest/cargo.
  # The archived Spiral-Slim repo had ci.yml; this monorepo had none.
  slim:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python collection tests
        working-directory: apps/slim
        run: |
          python3 -m pip install --user pytest
          python3 -m pytest tests/ -q

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/slim/desktop/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/slim/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/slim/desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: apps/slim/desktop
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        working-directory: apps/slim/desktop
        run: pnpm sync-brand

      - name: Desktop hex + typecheck
        working-directory: apps/slim/desktop
        run: pnpm check:hex && pnpm typecheck

      - name: Build the frontend
        working-directory: apps/slim/desktop
        run: pnpm build

      - name: Desktop frontend tests
        working-directory: apps/slim/desktop
        run: pnpm test

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time, so cargo test needs the Vite export from the build step above.
      - name: Desktop Rust tests
        working-directory: apps/slim/desktop/src-tauri
        run: cargo test

  # Per-push CI, not the release build. On a tag the shared workflow builds
  # Windows itself, and running both would spend five minutes producing a
  # second copy of bundles nobody publishes.
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/wallpaper
    # Lifted to job level so the build and upload steps can branch on whether
    # a signing key is actually available. The `secrets` context is not usable
    # in a step `if:`, but `env` is.
    env:
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/wallpaper/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/wallpaper/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/wallpaper/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/assets/brand is generated from /brand and gitignored, so it must
      # exist before tsc and the Vite build resolve their SVG imports.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates (hex guard + typecheck)
        run: pnpm check:hex && pnpm tsc --noEmit

      # Two build steps, split on whether the updater signing key is present.
      #
      # Dependabot pull requests run without repository secrets by design, so
      # TAURI_SIGNING_PRIVATE_KEY is empty there. Passing an empty string is
      # worse than passing nothing: Tauri treats it as a key and dies with
      # "failed to decode secret key". Omitting the key is still not enough:
      # tauri.conf.json has createUpdaterArtifacts: true and a pubkey, so after
      # MSI/NSIS are written Tauri tries to sign updater artifacts and dies
      # with "A public key has been found, but no private key".
      #
      # Unsigned builds therefore merge createUpdaterArtifacts: false from
      # tauri.unsigned.conf.json. A file, not inline JSON: Windows runners use
      # PowerShell, which strips the quotes from '{"bundle":{...}}' so Tauri
      # receives `{bundle:{...}}` and dies before compile. Do not use --no-sign:
      # that still errors on a pubkey. Do not copy the key into Dependabot
      # secrets. Signed main builds keep the default config and the key, so
      # updater artifacts stay as they are today.
      - name: Build Tauri app (signed)
        if: env.TAURI_KEY != ''
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build Tauri app (unsigned — no signing key in this context)
        if: env.TAURI_KEY == ''
        run: pnpm tauri build --config src-tauri/tauri.unsigned.conf.json

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: spiral-windows
          path: |
            apps/wallpaper/src-tauri/target/release/bundle/msi/*.msi
            apps/wallpaper/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Separate step so the signed path still hard-fails when a .sig is
      # missing, while unsigned PR builds simply skip it.
      - name: Upload updater signatures
        if: env.TAURI_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: spiral-windows-signatures
          path: apps/wallpaper/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  # Spiral Clean's safety core is the whole point of the app: `remove.rs`,
  # `exclude.rs` and `paths.rs` are the only thing standing between a wrong
  # path and a permanent delete, and they are proven by a Rust test suite that
  # until now ran nowhere but a developer's laptop. A regression there is not
  # a broken build, it is deleted user data, so it gets the same per-push gate
  # everything else in this repo has.
  #
  # macOS, not ubuntu: the app is macOS-only by decision, `paths.rs` encodes
  # macOS firmlink behaviour, and `tauri` would need a webkit2gtk install on
  # Linux to compile at all. No `if:` skipping tags either — Clean releases on
  # `clean-v*`, which this workflow does not listen for, so there is no
  # release build for this job to duplicate.
  # Per-push CI, not a release build. Every app's tag is handled by its own
  # release workflow, so running this on any tag just rebuilds what the
  # release job is already building.
  clean:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/clean
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/clean/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/clean/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/clean/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/styles/tokens.css and src/assets/brand are generated from /brand
      # and gitignored, so they must exist before check-hex and tsc read them.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates (hex guard + typecheck)
        run: pnpm check:hex && pnpm tsc --noEmit

      # Before `cargo test`, not after: `tauri::generate_context!` resolves
      # `frontendDist` (../dist) at compile time, so the Rust crate does not
      # build at all until the Vite export exists.
      - name: Build the frontend
        run: pnpm build

      # `pnpm build` type-checks the frontend but runs none of its tests, so
      # this job was green against a regression the local suite catches: revert
      # format.ts to the loop that tested `value >= 1024` before rounding and
      # the two 1024-rollover tests fail here, while CI reported nothing.
      - name: Frontend tests
        run: pnpm test

      - name: Rust safety suite
        working-directory: apps/clean/src-tauri
        run: cargo test

      - name: Clippy
        working-directory: apps/clean/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Spiral Resume. The app shipped without a job here, so its 169 Rust tests and
  # 76 frontend tests only ever ran on the machine that wrote them.
  #
  # No `tauri build`: bundling needs the `llama-server` sidecar, which is built
  # from source by `pnpm build-sidecar` and deliberately not in the repository.
  # That is why `externalBin` lives in `tauri.bundle.conf.json` rather than the
  # base config — declared in the base, `tauri-build` refuses to compile at all
  # on any machine without the binary, which is every runner and every fresh
  # clone.
  resume:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/Resume
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/Resume/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/Resume/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Typst and its font set dominate this crate's build; without the cache
      # every run pays several minutes for dependencies that never change.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/Resume/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/styles/tokens.css and src/assets/brand come from /brand and are
      # gitignored, so they must exist before check-hex and tsc read them.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates (hex guard + typecheck)
        run: pnpm check:hex && pnpm tsc --noEmit

      # Before the Rust steps: `tauri::generate_context!` resolves `frontendDist`
      # at compile time, so the crate does not build until the Vite export exists.
      - name: Build the frontend
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: apps/Resume/src-tauri
        run: cargo test

      # The fact gate, the safety rules and the template lints are all enforced
      # here. Warnings are errors: this crate has no crate-wide allow.
      - name: Clippy
        working-directory: apps/Resume/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # Everything below a tag is the shared workflow's job. It was extracted from
  # the copy that used to live here, and keeping both meant maintaining two of
  # them — the failure this repo keeps rediscovering, most recently when four
  # version files disagreed. Spiral Slim already calls it; the wallpaper is the
  # reason it exists.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Required, and the reason this call refused to start at all. A called
    # workflow can never hold more than its caller was granted, and this
    # repository's default token permission is read — so `publish` asking for
    # `contents: write` exceeded a caller that had asked for nothing, and
    # GitHub rejected the whole file before any job existed. A job that runs
    # directly may request write for itself; a job that delegates has to be
    # granted it here and pass it down.
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    with:
      app-dir: apps/wallpaper
      artifact-prefix: spiral
      macos: true
      windows: true
      updater: true
      github-latest: true
    secrets: inherit

  # Wallpaper-specific, so it stays here rather than in the shared workflow:
  # the phrases it rewrites are this app's download lines. Runs only after the
  # release exists, because the filenames it writes are not true until the
  # artifacts are attached.
  docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Open a pull request pointing the docs at this release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/update-release-docs.mjs --version "${VERSION#v}"

          if git diff --quiet; then
            echo "docs already describe ${VERSION}; nothing to open."
            exit 0
          fi

          BRANCH="docs/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -aqm "docs: point the download and release notes at ${VERSION}"

          # Re-running a release on the same tag has to be safe. A plain push
          # to an existing docs/<tag> is a non-fast-forward and fails, and a
          # second `gh pr create` for the same head fails too — both of them
          # *after* the release was published, which is the worst place to put
          # an avoidable error. The branch is regenerated from the tag every
          # time, so overwriting it is the intended behaviour rather than a
          # loss; --force-with-lease still refuses if someone edited it.
          git push -q --force-with-lease origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number \
               --jq 'length' | grep -qv '^0$'; then
            echo "A pull request for $BRANCH is already open; updated its branch."
            exit 0
          fi

          # Heredoc, not an inline string: a quoted body indented to match this
          # block would carry its leading spaces into the PR, and four spaces
          # is a code block in Markdown.
          gh pr create --base main --head "$BRANCH" \
            --title "docs: point the download and release notes at ${VERSION}" \
            --body-file - <<BODY
          Opened by the release job once ${VERSION} was published.

          Rewrites the download filenames and the current-release lines in \`README.md\` and \`CLAUDE.md\`, generated by \`scripts/update-release-docs.mjs\` — which anchors on whole phrases rather than the bare version string, so a checksum or a pinned dependency that happens to contain those digits is left alone.

          The run log lists any other version reference it deliberately did not touch.
          BODY
