name: build

on:
  push:
    branches: [main]
    # A v* tag cuts a release: the macos job builds signed and notarized, and
    # the release job publishes both platforms together.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# No workflow-level `defaults`. A job that calls a reusable workflow accepts
# only a fixed set of keys — name, needs, if, permissions, uses, with, secrets,
# strategy, concurrency — and a workflow-wide default tries to apply `defaults`
# to it, which GitHub rejects before the run starts. The one job that wants a
# different directory now says so itself, which is also plainer to read.
# One run per ref. Without this, two runs can exist for the same tag and both
# reach `publish`, racing to create the same GitHub Release — which is exactly
# what happened to v1.0.3 on 2026-08-06, when a dispatched run and a
# late-firing push run appeared 21 seconds apart.
#
# `cancel-in-progress` is true for branches and pull requests, where a newer
# push makes an older run pointless, and **false for tags**: cancelling a
# release part-way through publishing is a worse outcome than the duplicate.
# A second tag run instead queues behind the first and then fails loudly at
# `publish` because the release already exists, which is a clear answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Builds the website on every push and pull request, and deploys it when the
  # push is to main. It used to only build: deploying was a manual Pages
  # upload, which meant main could be green and correct for days while the
  # live site served something older, with nothing anywhere saying so.
  #
  # The deploy reuses this job's own `out/` rather than living in a job of its
  # own, so what ships is byte-for-byte what lint, typecheck, and build just
  # passed on — not a second build of the same commit.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection
    # Job level so the deploy step can branch on whether the token exists: the
    # `secrets` context is not usable in a step `if:`, but `env` is. Same
    # reason the Windows job lifts TAURI_KEY.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check checkout URLs
        working-directory: .
        run: node scripts/check-checkout.mjs

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: collection/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collection/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # brand-tokens.json and public/brand are gitignored sync outputs; typecheck
      # imports the JSON and CSS imports the tokens file.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Lint + format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `prebuild` runs sync-brand again; a missing /brand asset fails here
      # rather than silently shipping a 404 to production.
      - name: Build static export
        run: pnpm build

      # Only a push to main, never a pull request: a PR deploying to production
      # would put unreviewed work on the live site, and PR builds already prove
      # the thing compiles. Forks and Dependabot get no token at all, so this
      # cannot fire from them even if the ref check were wrong.
      #
      # `out/` is the export this job already linted, typechecked and built —
      # wrangler uploads a directory and never builds, so what ships is
      # byte-for-byte what passed rather than a second build of the same commit.
      #
      # `--branch=main` is what marks the deployment as production. Without it
      # Pages treats every upload as a preview, and the site would go on
      # building green while the live URL never moved.
      #
      # Both secrets, not just the token. Wrangler reads the account id from the
      # environment to know whose account to talk to, so a token without one
      # gets past a token-only check and then fails mid-deploy — a red build on
      # main for a configuration mistake the skip path below exists to handle
      # quietly.
      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --package=wrangler@4.151.2 dlx wrangler pages deploy out --project-name=spiral-collection --branch=main

      # A push to main that cannot deploy should say so rather than report a
      # green build that shipped nothing. Not a failure: the build itself was
      # fine, and failing here would make the repo unusable for anyone who
      # forks it without the secrets.
      # Names the one that is missing rather than both. "Add these two secrets"
      # when one is already set sends someone to check a value that is fine.
      - name: Say so when the deploy was skipped
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          echo "::warning::Built but not published — missing repository secret(s):$missing"
          echo "Add them under Settings -> Secrets and variables -> Actions."
          exit 0

  # Per-push checks for Spiral. A tag build belongs to the release job.
  spiral:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/spiral
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/spiral/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/spiral/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/spiral/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates
        run: pnpm check:hex && pnpm exec tsc --noEmit

      - name: Build the frontend
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: apps/spiral/src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: apps/spiral/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Per-push compile, not the release build. On a tag the shared workflow
  # builds Windows itself.
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/spiral
    env:
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/spiral/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/spiral/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/spiral/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Build the frontend
        run: pnpm build

      # `pnpm tauri build` adds the helper bundle config, whose externalBin
      # includes llama-server, so the sidecar has to exist first. Same step as
      # the Windows job in release-app.yml.
      - name: Build the sidecar
        run: pnpm build-sidecar

      - name: Build Tauri app (signed)
        if: env.TAURI_KEY != ''
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build Tauri app (unsigned, no signing key in this context)
        if: env.TAURI_KEY == ''
        run: pnpm tauri build --config src-tauri/tauri.unsigned.conf.json

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: spiral-windows
          path: |
            apps/spiral/src-tauri/target/release/bundle/msi/*.msi
            apps/spiral/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload updater signatures
        if: env.TAURI_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: spiral-windows-signatures
          path: apps/spiral/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    with:
      app-dir: apps/spiral
      artifact-prefix: spiral
      macos: true
      windows: true
      updater: true
      github-latest: true
      sidecar: true
      bundle-config: src-tauri/tauri.bundle.conf.json
    secrets: inherit

  # Runs after the release exists. The filenames are not true until the
  # artifacts are attached.
  docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Open a pull request pointing the docs at this release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/update-release-docs.mjs --version "${VERSION#v}"

          if git diff --quiet; then
            echo "docs already describe ${VERSION}; nothing to open."
            exit 0
          fi

          BRANCH="docs/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -aqm "docs: point the download and release notes at ${VERSION}"

          # Re-running a release on the same tag has to be safe. A plain push
          # to an existing docs/<tag> is a non-fast-forward and fails, and a
          # second `gh pr create` for the same head fails too — both of them
          # *after* the release was published, which is the worst place to put
          # an avoidable error. The branch is regenerated from the tag every
          # time, so overwriting it is the intended behaviour rather than a
          # loss; --force-with-lease still refuses if someone edited it.
          git push -q --force-with-lease origin "$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number \
               --jq 'length' | grep -qv '^0$'; then
            echo "A pull request for $BRANCH is already open; updated its branch."
            exit 0
          fi

          # Heredoc, not an inline string: a quoted body indented to match this
          # block would carry its leading spaces into the PR, and four spaces
          # is a code block in Markdown.
          gh pr create --base main --head "$BRANCH" \
            --title "docs: point the download and release notes at ${VERSION}" \
            --body-file - <<BODY
          Opened by the release job once ${VERSION} was published.

          Rewrites the download filenames and the current-release lines in \`README.md\` and \`CLAUDE.md\`, generated by \`scripts/update-release-docs.mjs\` — which anchors on whole phrases rather than the bare version string, so a checksum or a pinned dependency that happens to contain those digits is left alone.

          The run log lists any other version reference it deliberately did not touch.
          BODY
