name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/wallpaper

jobs:
  # The website deploys via the Netlify CLI, not a git trigger, so nothing else
  # would catch a broken build before someone runs `netlify deploy`.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collection
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: collection/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collection/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `prebuild` runs sync-brand, so a missing or renamed /brand asset fails
      # here rather than silently shipping a 404 to production.
      - name: Build static export
        run: pnpm build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/wallpaper/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/wallpaper/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/wallpaper/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/assets/brand is generated from /brand and gitignored, so it must
      # exist before tsc and the Vite build resolve their SVG imports.
      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates (hex guard + typecheck)
        run: pnpm check:hex && pnpm tsc --noEmit

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: spiral-windows
          path: |
            apps/wallpaper/src-tauri/target/release/bundle/msi/*.msi
            apps/wallpaper/src-tauri/target/release/bundle/nsis/*.exe
            apps/wallpaper/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
