name: license-worker

on:
  push:
    branches: [main]
    paths:
      - "workers/license/**"
      - "crates/spiral-license/**"
      - "scripts/check-whop.mjs"
  pull_request:
    paths:
      - "workers/license/**"
      - "crates/spiral-license/**"
      - "scripts/check-whop.mjs"
  workflow_dispatch:

concurrency:
  group: license-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whop-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-whop.mjs

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/license
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: workers/license/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/license/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy to Cloudflare Workers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --package=wrangler@4 dlx wrangler deploy

      - name: Verify live health
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://spiral-license.cohencool.workers.dev/health | grep -q '"ok":true'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after deploy"
          exit 1

      - name: Say so when deploy was skipped
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::warning::Worker tested but not deployed — missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
          exit 0

  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test spiral-license crate
        run: cargo test -p spiral-license
