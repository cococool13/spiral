name: release-app

# The release pipeline, once, for any Tauri app in this repo.
#
# Spiral Wallpaper's release was written inline in build.yml and took three
# attempts to get right — a macOS updater bundle named differently than assumed,
# artifacts arriving as directories, and a step running in the wrong directory.
# None of that is worth rediscovering per app. A second app copying that job
# would copy the bugs it had before those fixes landed.
#
# Called by a thin per-app workflow that owns only its tag pattern:
#
#   jobs:
#     release:
#       uses: ./.github/workflows/release-app.yml
#       secrets: inherit
#       with:
#         app-dir: apps/spiral
#         artifact-prefix: spiral
#         windows: true
#
# Spiral calls this workflow and sets github-latest so /releases/latest
# stays on a v2 tag or later.

on:
  workflow_call:
    inputs:
      app-dir:
        description: Path to the app, for example apps/spiral
        required: true
        type: string
      artifact-prefix:
        description: Prefix for uploaded artifact names, e.g. spiral
        required: true
        type: string
      macos:
        description: Build, sign, and notarize a universal macOS bundle
        type: boolean
        default: true
      windows:
        description: Build Windows installers
        type: boolean
        default: false
      updater:
        description: >
          Emit latest.json and require a signed updater bundle. Off unless the
          app actually ships an updater — a manifest for an app with no updater
          plugin is a file nobody reads, and requiring a .sig that Tauri was
          never asked to produce fails the release for no reason.
        type: boolean
        default: false
      github-latest:
        description: >
          Mark this GitHub release as the repository's /releases/latest.
          Spiral sets this true. Its updater and the site All downloads link
          read that URL.
        type: boolean
        default: false
      macos-target:
        description: Rust target triple for the macOS build
        type: string
        default: universal-apple-darwin
      sidecar:
        description: >
          Run `pnpm build-sidecar` on each runner before building. A sidecar is
          a native compile, not a cross-compile, so each platform builds its
          own. Spiral builds llama-server this way.
        type: boolean
        default: false
      bundle-config:
        description: >
          An extra Tauri config to merge in, relative to the app directory —
          `src-tauri/tauri.bundle.conf.json` for an app whose sidecar is
          declared separately, so a machine without the binary can still
          compile the app. Empty means build with the plain config.
        type: string
        default: ""
      publish:
        description: >
          Create the GitHub release from the build artifacts. False builds,
          signs and uploads workflow artifacts only, with no release, for
          example a Windows build for a release that already exists. Tag
          pushes never set it, so they keep publishing.
        type: boolean
        default: true

jobs:
  macos:
    if: inputs.macos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Deliberately NOT TAURI_SIGNING_PRIVATE_KEY. Setting it at job level
      # means setting it to "" whenever updater is false, and an empty env var
      # is still a set env var: Tauri reads it as a key and dies with "failed
      # to decode secret key". build.yml already carries that scar from every
      # Dependabot PR. It is passed only to the step that needs it, below.
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Stop before building rather than after. An unsigned or un-notarized
      # macOS build is worse than no release: Gatekeeper blocks it. Naming the
      # missing secrets is the whole job of this step.
      - name: Require signing and notarization credentials
        working-directory: .
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ "${{ inputs.updater }}" = "true" ] && [ -z "$TAURI_KEY" ]; then
            missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Cannot cut a macOS release. Missing repository secrets:$missing"
            exit 1
          fi
          echo "All required credentials present."

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.app-dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.app-dir }}/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.app-dir }}/src-tauri

      # A throwaway keychain keeps this off the runner's login keychain and
      # disappears with the runner.
      - name: Import the Developer ID certificate
        working-directory: .
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not every app has these; `--if-present` keeps the shared workflow from
      # requiring a script an app never needed.
      - name: Sync brand assets
        run: pnpm run --if-present sync-brand

      # Before the build: the sidecar has to exist for the bundler to copy it.
      - name: Build the sidecar
        if: inputs.sidecar
        run: pnpm build-sidecar

      # Universal, to match every previous release: one download that runs
      # native on both architectures. Two steps rather than one conditional
      # env: the signing key must be absent, not empty, when there is no
      # updater — see the note on TAURI_KEY above.
      - name: Build and sign (with updater artifacts)
        if: inputs.updater
        run: |
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          pnpm tauri build --target ${{ inputs.macos-target }} ${{ inputs.bundle-config && format('--config {0}', inputs.bundle-config) || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build and sign
        if: ${{ !inputs.updater }}
        run: |
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          pnpm tauri build --target ${{ inputs.macos-target }} ${{ inputs.bundle-config && format('--config {0}', inputs.bundle-config) || '' }}

      - name: Sign helpers, sign the app, and assert entitlements
        run: |
          set -euo pipefail
          APP=$(echo src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app)
          node scripts/sign-helpers.mjs "$APP"

      - name: Notarize the app and rebuild the disk image
        run: |
          set -euo pipefail
          APP=$(echo src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app)
          NAME=$(basename "$APP")
          WORK="$RUNNER_TEMP/spiral-notarize"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          ditto -c -k --keepParent "$APP" "$WORK/app.zip"
          xcrun notarytool submit "$WORK/app.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          DMG_DIR="src-tauri/target/${{ inputs.macos-target }}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg
          VERSION="${GITHUB_REF_NAME##*v}"
          DMG="$DMG_DIR/Spiral_${VERSION}_universal.dmg"
          hdiutil create -volname "Spiral" -srcfolder "$APP" -ov -format UDZO "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          if [ "${{ inputs.updater }}" = "true" ]; then
            PACK="$WORK/pack"
            mkdir -p "$PACK"
            cp -R "$APP" "$PACK/$NAME"
            TAR="src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/${NAME}.tar.gz"
            rm -f "$TAR" "$TAR.sig"
            tar -czf "$TAR" -C "$PACK" "$NAME"
            pnpm tauri signer sign "$TAR"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # The DMG is what a person downloads and exists either way.
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-macos
          path: ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Separate, and only when there is an updater. Tauri emits .app.tar.gz
      # and its .sig solely because createUpdaterArtifacts asked for them, so
      # listing them above with if-no-files-found: error would fail every
      # release of an app that has no updater — which is the exact case this
      # workflow was parameterised for.
      - name: Upload macOS updater bundle
        if: inputs.updater
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-macos-updater
          path: |
            ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app.tar.gz
            ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    if: inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      # Same reasoning as the macOS job: never TAURI_SIGNING_PRIVATE_KEY at job
      # level, because an empty value is worse than an absent one.
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.app-dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.app-dir }}/pnpm-lock.yaml

      - name: Require the Windows hook rehearsal
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node --input-type=module -e "import { existsSync, readFileSync } from 'node:fs'; const path = 'apps/spiral/src-tauri/windows/rehearsal.json'; if (!existsSync(path)) { console.error('Windows hook rehearsal has not passed. The release includes Windows and will not skip it.'); process.exit(1); } const receipt = JSON.parse(readFileSync(path, 'utf8')); if (receipt.windows !== 'passed') { console.error('Windows hook rehearsal has not passed. The release includes Windows and will not skip it.'); process.exit(1); }"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.app-dir }}/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        run: pnpm run --if-present sync-brand

      - name: Build the sidecar
        if: inputs.sidecar
        run: pnpm build-sidecar

      - name: Build Tauri app (with updater artifacts)
        if: inputs.updater
        run: pnpm tauri build ${{ inputs.bundle-config && format('--config {0}', inputs.bundle-config) || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build Tauri app
        if: ${{ !inputs.updater }}
        run: pnpm tauri build ${{ inputs.bundle-config && format('--config {0}', inputs.bundle-config) || '' }}

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows
          path: |
            ${{ inputs.app-dir }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ inputs.app-dir }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload updater signatures
        if: inputs.updater
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows-signatures
          path: ${{ inputs.app-dir }}/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    # Both build jobs may be skipped by their inputs; `always()` lets this run
    # anyway, and the guard below refuses a release where a job that was asked
    # for did not succeed. Without it, `needs` on a skipped job cancels this.
    # `publish: false` skips it entirely: build artifacts only, no release.
    if: always() && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to publish a partial release
        run: |
          if [ "${{ inputs.macos }}" = "true" ] && [ "${{ needs.macos.result }}" != "success" ]; then
            echo "::error::macOS was requested but its job did not succeed (${{ needs.macos.result }})."
            exit 1
          fi
          if [ "${{ inputs.windows }}" = "true" ] && [ "${{ needs.windows.result }}" != "success" ]; then
            echo "::error::Windows was requested but its job did not succeed (${{ needs.windows.result }})."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A tag that disagrees with the app's own version ships an installer whose
      # About box contradicts its download page.
      - name: Check the tag matches the app version
        working-directory: ${{ inputs.app-dir }}
        run: |
          TAG="${GITHUB_REF_NAME##*v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG) and tauri.conf.json ($CONF)."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true
          path: artifacts

      # merge-multiple drops the per-artifact folder but keeps each upload's own
      # directory structure, so this arrives as artifacts/dmg, artifacts/macos
      # and so on — directories, not files. Both the manifest script and
      # `gh release create artifacts/*` want one flat directory.
      - name: Flatten the downloaded bundles
        run: |
          find artifacts -mindepth 2 -type f -exec mv -n {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          ls -l artifacts

      - name: Build latest.json and SHA256SUMS.txt
        if: inputs.updater
        working-directory: ${{ inputs.app-dir }}
        run: |
          node scripts/make-release-manifest.mjs \
            --dir "$GITHUB_WORKSPACE/artifacts" \
            --version "${GITHUB_REF_NAME##*v}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Spiral Wallpaper is now Spiral. Your wallpapers and license carry over. Resume is included."

      # Without an updater there is no manifest, but checksums are still what
      # someone verifies a download against.
      # GitHub rewrites spaces to dots when it stores an asset, so
      # "Spiral Wallpaper_1.0.4_universal.dmg" is downloaded as
      # "Spiral.Wallpaper_1.0.4_...". Checksums have to name the file people
      # actually receive or `shasum -c` reports every entry missing. The
      # manifest script does the same substitution for the updater path, and
      # this is the half without one. Installed Wallpaper releases use that
      # spaced name, so the substitution stays.
      - name: Checksums only
        if: ${{ !inputs.updater }}
        run: |
          cd artifacts
          for f in *; do
            [ -f "$f" ] || continue
            printf '%s  %s\n' "$(shasum -a 256 "$f" | cut -d' ' -f1)" "${f// /.}"
          done > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Wallpaper alone passes github-latest=true. Everything else keeps
          # /releases/latest pointed at Wallpaper so the updater and the site's
          # "All downloads" link cannot land on the wrong product.
          MARK_LATEST: ${{ inputs.github-latest }}
        run: |
          LATEST_FLAG=--latest=false
          if [ "$MARK_LATEST" = "true" ]; then
            LATEST_FLAG=--latest=true
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$LATEST_FLAG" \
            artifacts/*
