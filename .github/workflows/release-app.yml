name: release-app

# The release pipeline, once, for any Tauri app in this repo.
#
# Spiral Wallpaper's release was written inline in build.yml and took three
# attempts to get right — a macOS updater bundle named differently than assumed,
# artifacts arriving as directories, and a step running in the wrong directory.
# None of that is worth rediscovering per app. A second app copying that job
# would copy the bugs it had before those fixes landed.
#
# Called by a thin per-app workflow that owns only its tag pattern:
#
#   jobs:
#     release:
#       uses: ./.github/workflows/release-app.yml
#       secrets: inherit
#       with:
#         app-dir: apps/slim/desktop
#         artifact-prefix: slim
#         windows: false
#
# Wallpaper deliberately still uses its own inline jobs. Migrating it means
# re-plumbing a pipeline whose only real test is cutting a release, and it has
# just been stabilised — it should move once this has run for another app.

on:
  workflow_call:
    inputs:
      app-dir:
        description: Path to the app, e.g. apps/slim/desktop
        required: true
        type: string
      artifact-prefix:
        description: Prefix for uploaded artifact names, e.g. slim
        required: true
        type: string
      macos:
        description: Build, sign, and notarize a universal macOS bundle
        type: boolean
        default: true
      windows:
        description: Build Windows installers
        type: boolean
        default: false
      updater:
        description: >
          Emit latest.json and require a signed updater bundle. Off unless the
          app actually ships an updater — a manifest for an app with no updater
          plugin is a file nobody reads, and requiring a .sig that Tauri was
          never asked to produce fails the release for no reason.
        type: boolean
        default: false
      macos-target:
        description: Rust target triple for the macOS build
        type: string
        default: universal-apple-darwin

jobs:
  macos:
    if: inputs.macos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Deliberately NOT TAURI_SIGNING_PRIVATE_KEY. Setting it at job level
      # means setting it to "" whenever updater is false, and an empty env var
      # is still a set env var: Tauri reads it as a key and dies with "failed
      # to decode secret key". build.yml already carries that scar from every
      # Dependabot PR. It is passed only to the step that needs it, below.
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Stop before building rather than after. An unsigned or un-notarized
      # macOS build is worse than no release: Gatekeeper blocks it. Naming the
      # missing secrets is the whole job of this step.
      - name: Require signing and notarization credentials
        working-directory: .
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ "${{ inputs.updater }}" = "true" ] && [ -z "$TAURI_KEY" ]; then
            missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Cannot cut a macOS release. Missing repository secrets:$missing"
            exit 1
          fi
          echo "All required credentials present."

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.app-dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.app-dir }}/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.app-dir }}/src-tauri

      # A throwaway keychain keeps this off the runner's login keychain and
      # disappears with the runner.
      - name: Import the Developer ID certificate
        working-directory: .
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not every app has these; `--if-present` keeps the shared workflow from
      # requiring a script an app never needed.
      - name: Sync brand assets
        run: pnpm run --if-present sync-brand

      # Universal, to match every previous release: one download that runs
      # native on both architectures. Two steps rather than one conditional
      # env: the signing key must be absent, not empty, when there is no
      # updater — see the note on TAURI_KEY above.
      - name: Build, sign, and notarize (with updater artifacts)
        if: inputs.updater
        run: pnpm tauri build --target ${{ inputs.macos-target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build, sign, and notarize
        if: ${{ !inputs.updater }}
        run: pnpm tauri build --target ${{ inputs.macos-target }}

      # The DMG is what a person downloads and exists either way.
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-macos
          path: ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Separate, and only when there is an updater. Tauri emits .app.tar.gz
      # and its .sig solely because createUpdaterArtifacts asked for them, so
      # listing them above with if-no-files-found: error would fail every
      # release of an app that has no updater — which is the exact case this
      # workflow was parameterised for.
      - name: Upload macOS updater bundle
        if: inputs.updater
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-macos-updater
          path: |
            ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app.tar.gz
            ${{ inputs.app-dir }}/src-tauri/target/${{ inputs.macos-target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    if: inputs.windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-dir }}
    env:
      # Same reasoning as the macOS job: never TAURI_SIGNING_PRIVATE_KEY at job
      # level, because an empty value is worse than an absent one.
      TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.app-dir }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.app-dir }}/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.app-dir }}/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        run: pnpm run --if-present sync-brand

      - name: Build Tauri app (with updater artifacts)
        if: inputs.updater
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Build Tauri app
        if: ${{ !inputs.updater }}
        run: pnpm tauri build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows
          path: |
            ${{ inputs.app-dir }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ inputs.app-dir }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload updater signatures
        if: inputs.updater
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-windows-signatures
          path: ${{ inputs.app-dir }}/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

