name: release-clean

# Spiral Clean releases on a `clean-v*` tag, independent of Wallpaper's bare
# `v*` and Slim's `slim-v*`.
#
#   git tag clean-v0.1.0 && git push origin clean-v0.1.0
#
# macOS only — apps/clean/src-tauri/tauri.conf.json already targets only
# ["app", "dmg"]. Updater is off: the updater plugin was removed from this app
# until the signing key exists (see apps/clean's release notes / M7); the
# reusable workflow's own comment warns that requiring a signed updater
# bundle before the app ships one fails the release for no reason.

on:
  push:
    tags: ["clean-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The tagged commit is what people download. Per-push CI skips tags, so this
  # gate is the only place the safety suite runs on the release artifact.
  verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/clean
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/clean/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/clean/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/clean/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync brand assets
        run: pnpm sync-brand

      - name: Quality gates
        run: pnpm check:hex && pnpm tsc --noEmit

      - name: Build the frontend
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

      - name: Rust safety suite
        working-directory: apps/clean/src-tauri
        run: cargo test

      - name: Clippy
        working-directory: apps/clean/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  release:
    needs: [verify]
    permissions:
      contents: write
    uses: ./.github/workflows/release-app.yml
    secrets: inherit
    with:
      app-dir: apps/clean
      artifact-prefix: clean
      macos: true
      windows: false
      updater: false
