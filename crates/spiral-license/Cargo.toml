[package]
name = "spiral-license"
version = "0.1.0"
edition = "2021"
description = "Whop license key check for Spiral desktop apps"
publish = false

[dependencies]
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
