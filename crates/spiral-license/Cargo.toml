[package]
name = "spiral-license"
version = "0.1.0"
edition = "2021"
description = "Signed license key check for Spiral desktop apps"
publish = false
workspace = "../../apps/spiral/src-tauri"

[dependencies]
# keyring 3 silently falls back to its in-memory mock store without a platform
# feature. No Linux store feature: Linux is not shipped, and it would add a libdbus
# build dependency.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "3"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
