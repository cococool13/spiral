# Spiral Collection site — static export. Base directory: website/
[build]
  command = "pnpm build"
  publish = "out"

# Hashed build assets never change — cache forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand fonts are stable subsets — cache forever
[[headers]]
  for = "/branding/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Other brand assets (mark, tokens, future demo media) — one day
[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
